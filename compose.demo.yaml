# Sample PostgreSQL sources for local exploration. Not used on a real
# server — point compose.yaml at your own databases via .env instead.
#
#   cp .env.demo.example .env
#   docker compose -f compose.yaml -f compose.demo.yaml up --build -d

services:
  postgres-sales:
    image: postgres:16.10-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=5
      - -c
      - max_wal_senders=5
    volumes:
      - ./postgres/sales/init:/docker-entrypoint-initdb.d:ro
      - postgres-sales-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sales']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  postgres-warehouse:
    image: postgres:16.10-alpine
    ports:
      - '5434:5432'
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=5
      - -c
      - max_wal_senders=5
    volumes:
      - ./postgres/warehouse/init:/docker-entrypoint-initdb.d:ro
      - postgres-warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d warehouse']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kafka-connect-init-sales:
    depends_on:
      postgres-sales:
        condition: service_healthy

  kafka-connect-init-warehouse:
    depends_on:
      postgres-warehouse:
        condition: service_healthy

volumes:
  postgres-sales-data:
    name: ${CDC_SALES_VOLUME_NAME:-cdc-stack-sales-data}
  postgres-warehouse-data:
    name: ${CDC_WAREHOUSE_VOLUME_NAME:-cdc-stack-warehouse-data}
